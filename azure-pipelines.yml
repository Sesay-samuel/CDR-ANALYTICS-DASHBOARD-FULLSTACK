# Azure DevOps CI Pipeline
# CDR Analytics Dashboard Full-Stack Application

trigger:
  branches:
    include:
      - main
      - feature/power-platform-csharp-plugin


jobs:

# =====================================================
# JOB 1 - Full-stack application and DevSecOps
# =====================================================

- job: FullStack_DevSecOps
  displayName: 'Full-Stack CI and DevSecOps'

  pool:
    vmImage: 'ubuntu-latest'

  steps:

    # -----------------------------------------------------
    # Node.js setup
    # -----------------------------------------------------

    - task: UseNode@1
      inputs:
        version: '20.x'
      displayName: 'Install Node.js'


    # -----------------------------------------------------
    # Frontend dependencies
    # -----------------------------------------------------

    - script: npm ci
      displayName: 'Install frontend dependencies'


    # -----------------------------------------------------
    # Frontend production build
    # -----------------------------------------------------

    - script: npm run build
      displayName: 'Build frontend production bundle'


    # -----------------------------------------------------
    # Backend dependencies
    # -----------------------------------------------------

    - script: npm ci
      workingDirectory: backend
      displayName: 'Install backend dependencies'


    # -----------------------------------------------------
    # Backend automated tests and coverage quality gate
    # -----------------------------------------------------

    - script: npm run test:coverage
      workingDirectory: backend
      displayName: 'Run backend tests and coverage quality gate'
      env:
        NODE_ENV: test
        JWT_SECRET: azure-pipeline-test-jwt-secret


    # -----------------------------------------------------
    # Azure Functions dependencies
    # -----------------------------------------------------

    - script: npm ci
      workingDirectory: azure-functions
      displayName: 'Install Azure Functions dependencies'


    # -----------------------------------------------------
    # Azure Functions automated tests
    # -----------------------------------------------------

    - script: npm test
      workingDirectory: azure-functions
      displayName: 'Run Azure Functions automated tests'


    # -----------------------------------------------------
    # Dependency vulnerability scanning
    # -----------------------------------------------------

    - script: npm audit --audit-level=high
      workingDirectory: backend
      displayName: 'Security scan - backend dependencies'

    - script: npm audit --audit-level=high
      workingDirectory: azure-functions
      displayName: 'Security scan - Azure Functions dependencies'


    # -----------------------------------------------------
    # Static Application Security Testing (SAST)
    # -----------------------------------------------------

    - script: |
        python -m pip install --upgrade pip
        python -m pip install semgrep
      displayName: 'Install Semgrep'

    - script: |
        semgrep scan --config auto --error \
          --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
          backend azure-functions
      displayName: 'SAST - Semgrep code security scan'


    # -----------------------------------------------------
    # Build backend Docker image
    # -----------------------------------------------------

    - script: |
        docker build \
          --pull \
          -t cdr-analytics-backend:$(Build.BuildId) \
          ./backend
      displayName: 'Build backend Docker image'


    # -----------------------------------------------------
    # Container vulnerability scanning
    # -----------------------------------------------------

    - script: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.74.0 \
          image \
          --scanners vuln \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          cdr-analytics-backend:$(Build.BuildId)
      displayName: 'Container security scan - Trivy'


# =====================================================
# JOB 2 - Power Platform C# Plugin
# =====================================================

- job: PowerPlatform_Plugin
  displayName: 'Power Platform C# Plugin CI'

  pool:
    vmImage: 'windows-latest'

  steps:

    # -----------------------------------------------------
    # Restore plugin and test dependencies
    # -----------------------------------------------------

    - script: >
        dotnet restore
        power-platform\plugins\CdrAnalyticsPlugin.Tests\CdrAnalyticsPlugin.Tests.csproj
      displayName: 'Restore Power Platform plugin dependencies'


    # -----------------------------------------------------
    # Build Dataverse C# plugin
    # -----------------------------------------------------

    - script: >
        dotnet build
        power-platform\plugins\CdrAnalyticsPlugin\CdrAnalyticsPlugin.csproj
        --configuration Release
        --no-restore
      displayName: 'Build Dataverse C# plugin'


    # -----------------------------------------------------
    # Power Platform automated tests
    # -----------------------------------------------------

    - script: >
        dotnet test
        power-platform\plugins\CdrAnalyticsPlugin.Tests\CdrAnalyticsPlugin.Tests.csproj
        --configuration Release
        --no-restore
      displayName: 'Run Power Platform plugin automated tests'