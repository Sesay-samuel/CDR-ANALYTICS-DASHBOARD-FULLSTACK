# Azure DevOps CI Pipeline
# CDR Analytics Dashboard Backend

trigger:
  branches:
    include:
      - main
      - feature/code-security-scanning

pool:
  vmImage: 'ubuntu-latest'

steps:
  # Install Node.js
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'

  # Install backend dependencies
  - script: npm ci
    workingDirectory: backend
    displayName: 'Install backend dependencies'

  # Run backend automated tests
  - script: npm test
    workingDirectory: backend
    displayName: 'Run backend Jest tests'
    env:
      NODE_ENV: test
      JWT_SECRET: azure-pipeline-test-jwt-secret

  # Scan backend dependencies for known vulnerabilities
  - script: npm audit --audit-level=high
    workingDirectory: backend
    displayName: 'Security scan - backend dependencies'

  # Install Semgrep static analysis scanner
  - script: |
      python -m pip install --upgrade pip
      python -m pip install semgrep
    displayName: 'Install Semgrep'

  # Static Application Security Testing (SAST)
  #
  # The Express CSRF middleware rule is excluded because this API
  # authenticates protected requests using explicit Authorization:
  # Bearer tokens rather than automatically attached authentication
  # cookies. All other Semgrep auto security rules remain enabled.
  - script: |
      semgrep scan --config auto --error \
        --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
        backend
    displayName: 'SAST - Semgrep code security scan'