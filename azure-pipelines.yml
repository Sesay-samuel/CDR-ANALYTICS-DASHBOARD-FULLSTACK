# Azure DevOps CI Pipeline
# CDR Analytics Dashboard Full-Stack Application

trigger:
  branches:
    include:
      - main
      - feature/azure-functions

pool:
  vmImage: 'ubuntu-latest'

steps:
  # -----------------------------------------------------
  # Node.js setup
  # -----------------------------------------------------

  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'


  # -----------------------------------------------------
  # Frontend dependencies
  # -----------------------------------------------------

  - script: npm ci
    displayName: 'Install frontend dependencies'


  # -----------------------------------------------------
  # Frontend production build
  # -----------------------------------------------------

  # Build the Vite/React application exactly as it will be
  # built for production. The pipeline fails if the build fails.
  - script: npm run build
    displayName: 'Build frontend production bundle'


  # -----------------------------------------------------
  # Backend dependencies
  # -----------------------------------------------------

  - script: npm ci
    workingDirectory: backend
    displayName: 'Install backend dependencies'


  # -----------------------------------------------------
  # Backend automated tests and code coverage quality gate
  # -----------------------------------------------------

  # Jest generates the coverage report and exits with a
  # non-zero status if coverage falls below the thresholds
  # configured in backend/package.json.
  - script: npm run test:coverage
    workingDirectory: backend
    displayName: 'Run backend tests and coverage quality gate'
    env:
      NODE_ENV: test
      JWT_SECRET: azure-pipeline-test-jwt-secret


  # -----------------------------------------------------
  # Azure Functions dependencies
  # -----------------------------------------------------

  - script: npm ci
    workingDirectory: azure-functions
    displayName: 'Install Azure Functions dependencies'


  # -----------------------------------------------------
  # Azure Functions automated tests
  # -----------------------------------------------------

  # Run programmatic Jest tests for the cdrAnalytics
  # Azure Function. The pipeline fails if any test fails.
  - script: npm test
    workingDirectory: azure-functions
    displayName: 'Run Azure Functions automated tests'


  # -----------------------------------------------------
  # Dependency vulnerability scanning
  # -----------------------------------------------------

  - script: npm audit --audit-level=high
    workingDirectory: backend
    displayName: 'Security scan - backend dependencies'

  - script: npm audit --audit-level=high
    workingDirectory: azure-functions
    displayName: 'Security scan - Azure Functions dependencies'


  # -----------------------------------------------------
  # Static Application Security Testing (SAST)
  # -----------------------------------------------------

  - script: |
      python -m pip install --upgrade pip
      python -m pip install semgrep
    displayName: 'Install Semgrep'

  # The Express CSRF middleware rule is excluded because this API
  # authenticates protected requests using explicit Authorization:
  # Bearer tokens rather than automatically attached authentication
  # cookies. All other Semgrep auto security rules remain enabled.
  - script: |
      semgrep scan --config auto --error \
        --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
        backend azure-functions
    displayName: 'SAST - Semgrep code security scan'


  # -----------------------------------------------------
  # Build backend Docker image
  # -----------------------------------------------------

  - script: |
      docker build \
        --pull \
        -t cdr-analytics-backend:$(Build.BuildId) \
        ./backend
    displayName: 'Build backend Docker image'


  # -----------------------------------------------------
  # Container vulnerability scanning
  # -----------------------------------------------------

  # Trivy exits with code 1 when a HIGH or CRITICAL
  # vulnerability is detected, causing the pipeline to fail.
  - script: |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:0.74.0 \
        image \
        --scanners vuln \
        --exit-code 1 \
        --severity HIGH,CRITICAL \
        cdr-analytics-backend:$(Build.BuildId)
    displayName: 'Container security scan - Trivy'